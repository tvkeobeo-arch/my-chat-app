<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>수공라이브</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #e2e8f0; display: flex; justify-content: center; height: 100dvh; }
    .app-container { width: 100%; max-width: 480px; height: 100dvh; background: #f4f6f8; display: flex; flex-direction: column; position: relative; }
    
    /* 가상 로그인 모달 */
    .login-overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .login-card { background: #fff; width: 100%; max-width: 320px; padding: 24px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
    .login-card h2 { color: #1e293b; font-size: 1.25rem; }
    .login-card input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .login-card button { height: 42px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .header { background: #1e293b; color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .brand h1 { font-size: 1.1rem; }
    .user-badge { font-size: 0.8rem; color: #38bdf8; background: #334155; padding: 4px 8px; border-radius: 6px; }
    
    .status-bar { background: #fff; color: #64748b; font-size: 0.8rem; text-align: center; padding: 6px; border-bottom: 1px solid #e2e8f0; }
    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg-group { display: flex; flex-direction: column; max-width: 80%; }
    .msg-group.my { align-self: flex-end; }
    .msg-group.partner { align-self: flex-start; }
    .msg-bubble { padding: 8px 12px; border-radius: 12px; font-size: 0.9rem; word-break: break-word; }
    .msg-group.my .msg-bubble { background: #2563eb; color: #fff; }
    .msg-group.partner .msg-bubble { background: #fff; color: #0f172a; border: 1px solid #e2e8f0; }
    .msg-system { align-self: center; background: #cbd5e1; font-size: 0.75rem; padding: 4px 8px; border-radius: 8px; }

    /* 개발자 패널 */
    .admin-panel { display: none; background: #0f172a; color: #38bdf8; padding: 10px; max-height: 200px; overflow-y: auto; font-size: 0.75rem; border-top: 2px solid #ef4444; }
    .admin-panel h3 { color: #ef4444; margin-bottom: 6px; }
    .admin-log { background: #1e293b; padding: 6px; margin-bottom: 4px; border-radius: 4px; }
    .ban-btn { background: #ef4444; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; margin-left: 6px; }
    .unban-btn { background: #10b981; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; margin-left: 6px; }

    .bottom-panel { background: #fff; padding: 10px; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 6px; }
    .input-row { display: flex; gap: 6px; }
    input[type="text"] { flex: 1; height: 40px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 16px; }
    button { height: 40px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; padding: 0 14px; }
    .btn-send { background: #3b82f6; color: white; }
    .action-row { display: flex; gap: 6px; }
    .btn-next { flex: 1; background: #10b981; color: white; }
    .btn-leave { flex: 1; background: #ef4444; color: white; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 가상 로그인 모달 -->
    <div class="login-overlay" id="loginOverlay">
      <div class="login-card">
        <h2>수공라이브 로그인</h2>
        <input type="text" id="loginId" placeholder="아이디 입력 (아무거나 가능)" />
        <input type="password" id="loginPw" placeholder="비밀번호 입력 (아무거나 가능)" />
        <button id="loginBtn">입장하기</button>
      </div>
    </div>

    <div class="header">
      <div class="brand"><h1>수공라이브</h1></div>
      <div class="user-badge" id="userBadge">비로그인</div>
    </div>

    <div class="status-bar" id="status">로그인이 필요합니다.</div>

    <!-- 개발자 패널 (0009) -->
    <div class="admin-panel" id="adminPanel">
      <h3>🛡️ 개발자 모드 (HR)</h3>
      <div id="adminLogs"></div>
      <h4 style="margin-top:8px;">차단된 IP 목록</h4>
      <div id="bannedList"></div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="bottom-panel">
      <div class="input-row">
        <input type="text" id="msgInput" placeholder="메시지 입력 (0009: 관리자)" disabled autocomplete="off">
        <button class="btn-send" id="sendBtn" disabled>전송</button>
      </div>
      <div class="action-row">
        <button class="btn-next" id="nextBtn">다음 상대</button>
        <button class="btn-leave" id="leaveBtn">대화 종료</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    const socket = io();
    const loginOverlay = document.getElementById('loginOverlay');
    const loginId = document.getElementById('loginId');
    const loginBtn = document.getElementById('loginBtn');
    const userBadge = document.getElementById('userBadge');
    
    const chatBox = document.getElementById('chatBox');
    const statusEl = document.getElementById('status');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    
    const adminPanel = document.getElementById('adminPanel');
    const adminLogs = document.getElementById('adminLogs');
    const bannedList = document.getElementById('bannedList');

    // 가상 로그인 처리
    loginBtn.addEventListener('click', () => {
      const id = loginId.value.trim();
      if (!id) return alert('아이디를 입력해 주세요!');
      
      userBadge.textContent = id;
      loginOverlay.style.display = 'none';
      
      // 서버로 로그인 이벤트 전송
      socket.emit('login', { userId: id });
    });

    function appendSystemMsg(text) {
      const div = document.createElement('div');
      div.className = 'msg-system';
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMsg(text, type) {
      const group = document.createElement('div');
      group.className = `msg-group ${type}`;
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;
      group.appendChild(bubble);
      chatBox.appendChild(group);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setChatActive(active) {
      msgInput.disabled = !active;
      sendBtn.disabled = !active;
      if (active) msgInput.focus();
    }

    socket.on('waiting', () => {
      statusEl.textContent = '상대방 대기 중...';
      setChatActive(false);
      appendSystemMsg('대기열에 등록되었습니다.');
    });

    socket.on('matched', () => {
      statusEl.textContent = '상대방과 연결됨!';
      setChatActive(true);
      appendSystemMsg('익명 상대와 대화가 시작되었습니다.');
    });

    socket.on('message', (msg) => appendMsg(msg, 'partner'));

    socket.on('banned', () => {
      alert('관리자에 의해 접속이 차단되었습니다.');
      location.reload();
    });

    // 관리자 모드 승인
    socket.on('admin_approved', (data) => {
      adminPanel.style.display = 'block';
      renderBannedList(data.bannedIPs);
      appendSystemMsg('[SYSTEM] 개발자 모드가 활성화되었습니다.');
    });

    socket.on('admin_chat_log', (log) => {
      const div = document.createElement('div');
      div.className = 'admin-log';
      div.innerHTML = `[대화] ${log.fromId}(${log.fromIp}) ➔ ${log.toId}(${log.toIp}): ${log.msg} 
        <button class="ban-btn" onclick="banIp('${log.fromIp}')">보낸이 IP 차단</button>`;
      adminLogs.appendChild(div);
      adminLogs.scrollTop = adminLogs.scrollHeight;
    });

    socket.on('admin_ban_updated', (list) => renderBannedList(list));

    function renderBannedList(list) {
      bannedList.innerHTML = list.map(ip => 
        `<div>${ip} <button class="unban-btn" onclick="unbanIp('${ip}')">해제</button></div>`
      ).join('');
    }

    function banIp(ip) { socket.emit('admin_ban_ip', ip); }
    function unbanIp(ip) { socket.emit('admin_unban_ip', ip); }

    function send() {
      const text = msgInput.value.trim();
      if (text) {
        socket.emit('message', text);
        if (text !== '0009') appendMsg(text, 'my');
        msgInput.value = '';
      }
    }

    sendBtn.addEventListener('click', send);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') send(); });
    document.getElementById('nextBtn').addEventListener('click', () => { chatBox.innerHTML = ''; socket.emit('findNext'); });
    document.getElementById('leaveBtn').addEventListener('click', () => socket.emit('leave'));
  </script>
</body>
</html>
