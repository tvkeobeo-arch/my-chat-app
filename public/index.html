<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>수공라이브</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #e2e8f0; display: flex; justify-content: center; height: 100dvh; }
    .app-container { width: 100%; max-width: 480px; height: 100dvh; background: #f4f6f8; display: flex; flex-direction: column; position: relative; }
    
    /* Auth 모달 */
    .auth-overlay { position: absolute; inset: 0; background: #0f172a; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-card { background: #fff; width: 100%; max-width: 320px; padding: 24px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
    .auth-tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 8px; }
    .auth-tab { flex: 1; padding: 8px; font-weight: bold; color: #64748b; cursor: pointer; }
    .auth-tab.active { color: #2563eb; border-bottom: 2px solid #2563eb; margin-bottom: -2px; }
    .auth-card input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .auth-card button { height: 42px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* 화면 분기 */
    .chat-screen { display: flex; flex-direction: column; height: 100%; width: 100%; }
    .header { background: #1e293b; color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .brand h1 { font-size: 1.1rem; }
    .user-badge { font-size: 0.8rem; color: #38bdf8; background: #334155; padding: 4px 8px; border-radius: 6px; }
    .status-bar { background: #fff; color: #64748b; font-size: 0.8rem; text-align: center; padding: 6px; border-bottom: 1px solid #e2e8f0; }
    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg-group { display: flex; flex-direction: column; max-width: 80%; }
    .msg-group.my { align-self: flex-end; }
    .msg-group.partner { align-self: flex-start; }
    .msg-bubble { padding: 8px 12px; border-radius: 12px; font-size: 0.9rem; word-break: break-word; }
    .msg-group.my .msg-bubble { background: #2563eb; color: #fff; }
    .msg-group.partner .msg-bubble { background: #fff; color: #0f172a; border: 1px solid #e2e8f0; }
    .msg-system { align-self: center; background: #cbd5e1; font-size: 0.75rem; padding: 4px 8px; border-radius: 8px; }
    .bottom-panel { background: #fff; padding: 10px; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 6px; }
    .input-row { display: flex; gap: 6px; }
    input[type="text"] { flex: 1; height: 40px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 16px; }
    button { height: 40px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; padding: 0 14px; }
    .btn-send { background: #3b82f6; color: white; }
    .action-row { display: flex; gap: 6px; }
    .btn-next { flex: 1; background: #10b981; color: white; }
    .btn-leave { flex: 1; background: #ef4444; color: white; }

    /* 관리자 대시보드 */
    .admin-screen { display: none; flex-direction: column; height: 100%; width: 100%; background: #0f172a; color: #f8fafc; padding: 12px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ef4444; padding-bottom: 8px; margin-bottom: 12px; }
    .admin-header h2 { color: #ef4444; font-size: 1.1rem; }
    .admin-section { margin-bottom: 12px; background: #1e293b; padding: 10px; border-radius: 8px; }
    .admin-section h3 { font-size: 0.85rem; color: #38bdf8; margin-bottom: 6px; }
    .admin-logs { height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; }
    .log-item { background: #334155; padding: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .ban-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .unban-btn { background: #10b981; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 로그인/회원가입 모달 -->
    <div class="auth-overlay" id="authOverlay">
      <div class="auth-card">
        <div class="auth-tabs">
          <div class="auth-tab active" id="tabLogin">로그인</div>
          <div class="auth-tab" id="tabRegister">회원가입</div>
        </div>
        <input type="text" id="authId" placeholder="아이디" />
        <input type="password" id="authPw" placeholder="비밀번호" />
        <button id="authBtn">로그인</button>
      </div>
    </div>

    <!-- 일반 채팅 화면 -->
    <div class="chat-screen" id="chatScreen">
      <div class="header">
        <div class="brand"><h1>수공라이브</h1></div>
        <div class="user-badge" id="userBadge">비로그인</div>
      </div>
      <div class="status-bar" id="status">로그인 대기 중</div>
      <div class="chat-box" id="chatBox"></div>
      <div class="bottom-panel">
        <div class="input-row">
          <input type="text" id="msgInput" placeholder="메시지 입력..." disabled autocomplete="off">
          <button class="btn-send" id="sendBtn" disabled>전송</button>
        </div>
        <div class="action-row">
          <button class="btn-next" id="nextBtn">다음 상대</button>
          <button class="btn-leave" id="leaveBtn">대화 종료</button>
        </div>
      </div>
    </div>

    <!-- 개발자 통제 대시보드 화면 -->
    <div class="admin-screen" id="adminScreen">
      <div class="admin-header">
        <h2>🛡️ 수공라이브 관리자 대시보드 (HR)</h2>
      </div>
      
      <div class="admin-section">
        <h3>실시간 대화 모니터링 & IP 차단</h3>
        <div class="admin-logs" id="adminLogs"></div>
      </div>

      <div class="admin-section">
        <h3>차단된 IP 목록</h3>
        <div id="bannedList" style="font-size:0.8rem; display:flex; flex-direction:column; gap:4px;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    const socket = io();
    let isRegisterMode = false;

    const authOverlay = document.getElementById('authOverlay');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const authId = document.getElementById('authId');
    const authPw = document.getElementById('authPw');
    const authBtn = document.getElementById('authBtn');

    const chatScreen = document.getElementById('chatScreen');
    const adminScreen = document.getElementById('adminScreen');
    const userBadge = document.getElementById('userBadge');
    const chatBox = document.getElementById('chatBox');
    const statusEl = document.getElementById('status');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    
    const adminLogs = document.getElementById('adminLogs');
    const bannedList = document.getElementById('bannedList');

    // 탭 전환
    tabLogin.addEventListener('click', () => {
      isRegisterMode = false;
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      authBtn.textContent = '로그인';
    });

    tabRegister.addEventListener('click', () => {
      isRegisterMode = true;
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      authBtn.textContent = '회원가입';
    });

    // 버튼 클릭 시 이벤트 분기
    authBtn.addEventListener('click', () => {
      const userId = authId.value.trim();
      const userPw = authPw.value.trim();

      if (!userId || !userPw) return alert('아이디와 비밀번호를 모두 입력하세요.');

      if (isRegisterMode) {
        socket.emit('register', { userId, userPw });
      } else {
        socket.emit('login', { userId, userPw });
      }
    });

    socket.on('auth_error', (msg) => alert(msg));

    socket.on('register_success', (msg) => {
      alert(msg);
      tabLogin.click(); // 로그인 탭으로 자동 이동
      authPw.value = '';
    });

    socket.on('login_success', (data) => {
      userBadge.textContent = data.userId;
      authOverlay.style.display = 'none';
    });

    socket.on('admin_login_success', (data) => {
      authOverlay.style.display = 'none';
      chatScreen.style.display = 'none';
      adminScreen.style.display = 'flex';
      renderBannedList(data.bannedIPs);
    });

    // 실시간 대화 모니터링
    socket.on('admin_chat_log', (log) => {
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `
        <div>
          <strong>${log.fromId}</strong> (${log.fromIp}) ➔ <strong>${log.toId}</strong> (${log.toIp})<br>
          <span style="color:#f1f5f9;">${log.msg}</span>
        </div>
        <button class="ban-btn" onclick="banIp('${log.fromIp}')">IP 차단</button>
      `;
      adminLogs.appendChild(div);
      adminLogs.scrollTop = adminLogs.scrollHeight;
    });

    socket.on('admin_ban_updated', (list) => renderBannedList(list));

    function renderBannedList(list) {
      if (list.length === 0) {
        bannedList.innerHTML = '<span style="color:#94a3b8;">차단된 IP가 없습니다.</span>';
        return;
      }
      bannedList.innerHTML = list.map(ip => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:#334155; padding:6px; border-radius:4px;">
          <span>${ip}</span>
          <button class="unban-btn" onclick="unbanIp('${ip}')">차단 해제</button>
        </div>
      `).join('');
    }

    function banIp(ip) { socket.emit('admin_ban_ip', ip); }
    function unbanIp(ip) { socket.emit('admin_unban_ip', ip); }

    function appendSystemMsg(text) {
      const div = document.createElement('div');
      div.className = 'msg-system';
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMsg(text, type) {
      const group = document.createElement('div');
      group.className = `msg-group ${type}`;
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;
      group.appendChild(bubble);
      chatBox.appendChild(group);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setChatActive(active) {
      msgInput.disabled = !active;
      sendBtn.disabled = !active;
      if (active) msgInput.focus();
    }

    socket.on('waiting', () => {
      statusEl.textContent = '상대방 대기 중...';
      setChatActive(false);
      appendSystemMsg('대기열에 등록되었습니다.');
    });

    socket.on('matched', () => {
      statusEl.textContent = '상대방과 연결됨!';
      setChatActive(true);
      appendSystemMsg('익명 대화가 시작되었습니다.');
    });

    socket.on('message', (msg) => appendMsg(msg, 'partner'));
    socket.on('banned', () => { alert('관리자에 의해 차단되었습니다.'); location.reload(); });

    function send() {
      const text = msgInput.value.trim();
      if (text) {
        socket.emit('message', text);
        appendMsg(text, 'my');
        msgInput.value = '';
      }
    }

    sendBtn.addEventListener('click', send);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') send(); });
    document.getElementById('nextBtn').addEventListener('click', () => { chatBox.innerHTML = ''; socket.emit('findNext'); });
    document.getElementById('leaveBtn').addEventListener('click', () => socket.emit('leave'));
  </script>
</body>
</html>
